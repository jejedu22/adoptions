services:
  app:
    build: .
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Définissez APP_SECRET dans .env.docker}
      DATABASE_URL: mysql://adoptions:${DB_PASSWORD:?Définissez DB_PASSWORD}@db:3306/adoptions?serverVersion=8.4&charset=utf8mb4
      # Hash bcrypt du mot de passe de « admin » (les $ sont à doubler dans un fichier .env : $$)
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:?Définissez APP_ADMIN_PASSWORD_HASH}
      # Traefik est le seul client direct de l'application : on fait confiance à ses en-têtes X-Forwarded-*
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-REMOTE_ADDR}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.adoptions.rule: Host(`${APP_HOST:?Définissez APP_HOST (nom de domaine)}`)
      traefik.http.routers.adoptions.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.adoptions.tls: "true"
      traefik.http.routers.adoptions.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.adoptions.loadbalancer.server.port: "80"
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: adoptions
      MYSQL_USER: adoptions
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  # Réseau déjà utilisé par Traefik (docker network ls)
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  db_data:
